name: Validate Guide Helpers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7 smoke tests
        shell: pwsh
        run: ./tests/Smoke.ps1
      - name: Windows PowerShell 5.1 smoke tests
        shell: powershell
        run: ./tests/Smoke.ps1
